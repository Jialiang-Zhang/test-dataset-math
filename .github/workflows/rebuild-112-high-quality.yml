name: Rebuild curated 112 high-difficulty dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-112-high-quality.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 112-question subset
        run: |
          python - <<'PY'
          import json
          import re
          import shutil
          from collections import Counter
          from pathlib import Path

          groups = {'离散数学': [39, 57, 73, 109, 127, 145, 163, 173, 191, 209, 227, 245, 263, 281, 299, 317, 335, 353, 371, 389, 407, 425, 443, 461], '数值分析': [128, 146, 174, 192, 210, 228, 246, 264, 282, 300, 354, 390, 462], '测度积分': [147, 175, 193, 211, 229, 247, 265, 283, 301, 445, 463], '微分几何': [148, 194, 248, 266, 320, 338, 374, 410, 464], '概率论': [149, 177, 195, 213, 339, 357, 375, 465], '抽象代数': [150, 178, 196, 232, 250, 304, 358, 466], '随机过程': [179, 197, 215, 233, 305, 377, 467], '复分析': [152, 234, 252, 342, 360, 414, 468], '常微分方程': [217, 289, 343, 397, 469], '统计推断': [254, 362, 416, 470], '泛函分析': [237, 273, 327, 453], '线性回归': [184, 382, 472], '偏微分方程': [275, 383, 455], '高等代数': [456], '运筹学': [475], '数学分析': [458], '拓扑学': [405], '非基础及进阶课程': [406, 460]}
          expected = {subject: len(ids) for subject, ids in groups.items()}
          required = ['idx', 'problem', 'answer', 'subject', 'source']

          selected_ids = [idx for ids in groups.values() for idx in ids]
          assert len(selected_ids) == 112
          assert len(set(selected_ids)) == 112

          def repair_json_text(raw: str) -> str:
              out = []
              in_string = False
              i = 0
              while i < len(raw):
                  ch = raw[i]
                  if not in_string:
                      out.append(ch)
                      if ch == '"':
                          in_string = True
                      i += 1
                      continue
                  if ch == '"':
                      out.append(ch)
                      in_string = False
                      i += 1
                  elif ch == '\\':
                      if i + 1 < len(raw) and raw[i + 1] in ('\\', '"'):
                          out.append(ch)
                          out.append(raw[i + 1])
                          i += 2
                      else:
                          out.append('\\\\')
                          i += 1
                  else:
                      out.append(ch)
                      i += 1
              return ''.join(out)

          rows = []
          seen_problems = set()
          actual_subjects = Counter()

          for subject, ids in groups.items():
              for old_idx in ids:
                  matches = list(Path('development').glob(f'*/{old_idx}.json'))
                  assert len(matches) == 1, (old_idx, matches)
                  raw = matches[0].read_text(encoding='utf-8')
                  obj = json.loads(repair_json_text(raw))
                  assert set(obj.keys()) == set(required), (old_idx, obj.keys())
                  assert obj['subject'] == subject, (old_idx, obj['subject'], subject)
                  assert isinstance(obj['problem'], str) and obj['problem'].strip()
                  assert isinstance(obj['answer'], str) and obj['answer'].strip()
                  assert isinstance(obj['source'], str) and obj['source'].strip()
                  normalized = re.sub(r'\s+', ' ', obj['problem']).strip()
                  assert normalized not in seen_problems, f'duplicate problem at source idx {old_idx}'
                  seen_problems.add(normalized)
                  rows.append(obj)
                  actual_subjects[subject] += 1

          assert dict(actual_subjects) == expected
          assert len(rows) == 112

          root = Path('112')
          tmp = Path('112_new')
          if tmp.exists():
              shutil.rmtree(tmp)
          tmp.mkdir()

          for new_idx, obj in enumerate(rows):
              clean = {
                  'idx': new_idx,
                  'problem': obj['problem'],
                  'answer': obj['answer'],
                  'subject': obj['subject'],
                  'source': obj['source'],
              }
              (tmp / f'{new_idx}.json').write_text(
                  json.dumps(clean, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          for i in range(112):
              p = tmp / f'{i}.json'
              obj = json.loads(p.read_text(encoding='utf-8'))
              assert list(obj.keys()) == required
              assert obj['idx'] == i

          root.mkdir(exist_ok=True)
          for p in root.glob('*.json'):
              p.unlink()
          for p in tmp.glob('*.json'):
              shutil.move(str(p), root / p.name)
          tmp.rmdir()

          readme_lines = [
              '# 112-question high-difficulty benchmark',
              '',
              '本目录已重新构建为 112 道高难度、高区分度数学题。文件名与内部 `idx` 完全一致，连续编号为 `0` 至 `111`。',
              '',
              '每条 JSON 严格且仅包含：`idx`、`problem`、`answer`、`subject`、`source`。',
              '',
              '## 学科配额与编号范围',
              '',
              '- `0`–`23`：离散数学（24）',
              '- `24`–`36`：数值分析（13）',
              '- `37`–`47`：测度积分（11）',
              '- `48`–`56`：微分几何（9）',
              '- `57`–`64`：概率论（8）',
              '- `65`–`72`：抽象代数（8）',
              '- `73`–`79`：随机过程（7）',
              '- `80`–`86`：复分析（7）',
              '- `87`–`91`：常微分方程（5）',
              '- `92`–`95`：统计推断（4）',
              '- `96`–`99`：泛函分析（4）',
              '- `100`–`102`：线性回归（3）',
              '- `103`–`105`：偏微分方程（3）',
              '- `106`：高等代数（1）',
              '- `107`：运筹学（1）',
              '- `108`：数学分析（1）',
              '- `109`：拓扑学（1）',
              '- `110`–`111`：非基础及进阶课程（2）',
              '',
              '合计：112 道。',
              '',
              '## 质量约束',
              '',
              '- 题目选自 `development/` 中已经过多轮复核的高难题。',
              '- 排除基础定义回忆、一步套公式、机械计算和明显数字换皮题。',
              '- 输出阶段重新解析全部文件，验证 JSON 合法性、五字段约束以及 `文件名 = idx`。',
          ]
          (root / 'README.md').write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')
          PY

      - name: Commit rebuilt dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 112
          git diff --cached --quiet && exit 0
          git commit -m "dataset: rebuild curated 112 high-difficulty benchmark"
          git push origin main
