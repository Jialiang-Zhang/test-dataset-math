name: Reindex curated 112 dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reindex-112.yml'

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename files and sync idx
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('112')
          files = sorted(
              [p for p in root.glob('*.json') if p.stem.isdigit()],
              key=lambda p: int(p.stem),
          )
          assert len(files) == 112, f'expected 112 json files, got {len(files)}'

          rows = [p.read_text(encoding='utf-8') for p in files]

          for p in files:
              p.unlink()

          for i, text in enumerate(rows):
              # Only replace the numeric value of the first idx field.
              new_text, n = re.subn(
                  r'("idx"\s*:\s*)-?\d+',
                  lambda m: m.group(1) + str(i),
                  text,
                  count=1,
              )
              assert n == 1, f'idx not found for new file {i}.json'
              (root / f'{i}.json').write_text(new_text, encoding='utf-8')

          # Final consistency check without reparsing historical JSON bodies.
          new_files = sorted(root.glob('*.json'), key=lambda p: int(p.stem))
          assert [int(p.stem) for p in new_files] == list(range(112))
          for i, p in enumerate(new_files):
              text = p.read_text(encoding='utf-8')
              m = re.search(r'"idx"\s*:\s*(-?\d+)', text)
              assert m and int(m.group(1)) == i, (p, m.group(1) if m else None)

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '- 保留源题原始 `idx`，便于追溯到 `development/` 中的原始记录。',
              '- 文件名与内部 `idx` 已统一重新编号为 `0` 至 `111`。',
          )
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Commit reindexed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 112
          git diff --cached --quiet && exit 0
          git commit -m "dataset: reindex curated 112 subset from 0 to 111"
          git push origin main
