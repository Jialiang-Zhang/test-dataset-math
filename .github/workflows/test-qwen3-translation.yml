name: Test Qwen3 non-thinking math translation

on:
  workflow_dispatch:
  push:
    branches:
      - build/open-zh-atomic-p3
    paths:
      - open_zh_atomic/QWEN3_TEST_TRIGGER
      - .github/workflows/test-qwen3-translation.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers
      - run: python open_zh_atomic/test_qwen3_translation.py
